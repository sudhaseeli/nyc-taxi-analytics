[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-analytics"
version = "0.1.0"
description = "Medallion data pipeline and analytics on NYC TLC yellow-taxi trips with DuckDB: incremental ingestion, cleaning with quarantine, data-quality gates, gold marts and a dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sudha Rani Seeli" }]
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taxi = "taxi.cli:main"

[tool.setuptools.packages.find]
include = ["taxi*"]

[tool.setuptools.package-data]
taxi = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
